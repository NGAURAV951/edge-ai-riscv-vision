name: PowerGuard checks

on:
  push:
    paths:
      - "powerguard/**"
      - ".github/workflows/powerguard-ci.yml"
  pull_request:
    paths:
      - "powerguard/**"
      - ".github/workflows/powerguard-ci.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: powerguard
        run: python -m unittest discover -s tests -v
      - name: Compile C demo
        working-directory: powerguard
        run: gcc -std=c99 -Wall -Wextra -pedantic firmware/power_monitor.c -o power_monitor
      - name: Run C demo
        working-directory: powerguard
        run: ./power_monitor
      - name: Run Python demo
        working-directory: powerguard
        run: python powerguard.py --input data/sample_readings.csv
